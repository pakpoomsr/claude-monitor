[package]
name = "claude-monitor-frontend"
version = { workspace = true }
edition = { workspace = true }

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
chrono = { workspace = true }

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Event",
    "CustomEvent",
]

[[bin]]
name = "claude-monitor-frontend"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
