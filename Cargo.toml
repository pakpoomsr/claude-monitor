[workspace]
members = ["src-tauri", "frontend"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
authors = ["Pakpoom S. <pakpoomtcm@gmail.com>"]
repository = "https://github.com/pakpoomsr/claude-monitor"
homepage = "https://github.com/pakpoomsr/claude-monitor"
description = "Desktop dashboard that watches Claude Code agents in real time."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
